# /etc/tsx/uc-pxx-leds.conf: settings of the daemon uc-pxx-leds.
#
# PERSIST: yes keeps the state of the four indicators and the status LED over
# a reboot. The daemon saves each command in /data/uc-pxx-leds.saved and plays
# it back at the next start. The status LED command plays back only after the
# boot is marked good. The default is no: all indicators are off after a boot.
# A reload of the service (rc-service uc-pxx-leds reload) reads this file again.
PERSIST=no
