# /etc/tsx/uc-pxx-leds.conf: settings of the daemon uc-pxx-leds.
#
# PERSIST: yes keeps the state of the four indicators and the status LED over
# a reboot. The daemon saves each command in /data/uc-pxx-leds.saved and plays
# it back at the next start. The status LED command plays back only after the
# boot is marked good. The default is no: all indicators are off after a boot.
# A reload of the service (rc-service uc-pxx-leds reload) reads this file again.
PERSIST=no

# READY_SOURCE: when the boot display ends. The status LED blinks blue until
# the system is ready, then shows solid green (BOOT_OK_HOLD_S) and goes dark.
#   auto     kiosk if the service kiosk is in the default runlevel, else openrc
#   kiosk    /run/tsx/kiosk.ready exists (the page has painted)
#   openrc   OpenRC has finished the default runlevel
#   bootctl  slot A is marked successful (the A/B mark)
# The commands for the status LED stay locked until the A/B mark, for every
# source.
READY_SOURCE=auto

# READY_TIMEOUT_S: if the system is not ready after this many seconds from the
# start of the daemon, the daemon goes by the A/B mark (as READY_SOURCE=bootctl).
READY_TIMEOUT_S=180

# BOOT_OK_HOLD_S: after the system is ready, the status LED shows solid green for
# this number of seconds and then goes dark. 0 keeps the green on. A status
# command (Home Assistant, uc-pxx-led) changes the LED at any time after the
# A/B mark. "status auto" gives it back to this boot display.
BOOT_OK_HOLD_S=10
