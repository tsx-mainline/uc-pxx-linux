name: tests
on:
  push:
  pull_request:

# These jobs need no hardware and no vendor file. A test that needs a tool
# that the runner does not have prints SKIPPED and exits 0.
jobs:
  lint:
    name: syntax and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install busybox
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends busybox
      - name: ci/lint.sh (shell syntax, py_compile, doc links, overlay modes)
        run: ci/lint.sh

  doc-links:
    name: doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ci/check-doc-links.py
        run: python3 ci/check-doc-links.py

  no-proprietary:
    name: no vendor files in the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ci/check-no-proprietary.sh
        run: ci/check-no-proprietary.sh

  host-tests:
    name: host tests (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends busybox python3
      - name: rootfs/tests/test-profiles.sh - the package, service and image file lists of the console, kiosk and ha profiles
        run: sh rootfs/tests/test-profiles.sh
      - name: rootfs/tests/test-rescue.sh - the rescue screen, console font and login with the tools of tsx-linux-common (SKIPPED without a checkout)
        run: busybox sh rootfs/tests/test-rescue.sh
      - name: rootfs/tests/test-install-rootfs.sh - uc-pxx-install-rootfs against a made-up /sys and /dev
        run: busybox sh rootfs/tests/test-install-rootfs.sh
      - name: rootfs/tests/test-loader-key.sh - Volume down + Mute for the loader mode, in the service and in /init
        run: busybox sh rootfs/tests/test-loader-key.sh
      - name: rootfs/tests/test-reboot.sh - uc-pxx-reboot loader|fastboot, the shutdown line of inittab and the direct path of /init
        run: busybox sh rootfs/tests/test-reboot.sh
      - name: rootfs/tests/test-board.sh - the board file, the MAC address from the cfg partition and the model
        run: sh rootfs/tests/test-board.sh
      - name: rootfs/tests/test-post-update.sh - uc-pxx-post-update with stubs for the boot control tools
        run: busybox sh rootfs/tests/test-post-update.sh
      - name: rootfs/tests/test-boot-ok.sh - the service uc-pxx-boot-ok with stub OpenRC functions and a stub hook
        run: busybox sh rootfs/tests/test-boot-ok.sh
      - name: rootfs/tests/test-boot-ok-openrc.sh - the service uc-pxx-boot-ok under a real OpenRC (Alpine container)
        run: sh rootfs/tests/test-boot-ok-openrc.sh
      - name: rootfs/tests/test-hw.sh - tsx-hw facts and the layers of panel-board.d with a made-up /sys
        run: sh rootfs/tests/test-hw.sh
      - name: rootfs/tests/test-als.sh - uc-pxx-als and tsx-als with a made-up IIO device (python3)
        run: sh rootfs/tests/test-als.sh
      - name: rootfs/tests/test-presence.sh - uc-pxx-presence with a made-up input device and a stub for tsx-blank (python3)
        run: sh rootfs/tests/test-presence.sh
      - name: rootfs/tests/test-audio.sh - uc-pxx-audio with a stub amixer
        run: sh rootfs/tests/test-audio.sh
      - name: rootfs/tests/test-firmware.sh - uc-pxx-firmware with a made-up vendor folder
        run: sh rootfs/tests/test-firmware.sh
      - name: rootfs/tests/test-clock.sh - uc-pxx-clock and the write-back sysctl
        run: sh rootfs/tests/test-clock.sh
      - name: rootfs/tests/test-switch.sh - uc-pxx-switch with stub tools
        run: sh rootfs/tests/test-switch.sh
      - name: rootfs/tests/test-watchdog.sh - watchdog service timeout and interval checks
        run: sh rootfs/tests/test-watchdog.sh
      - name: packages/uc-pxx-leds/tests/test-package.sh - the file list of the LED package and the rule of one writer
        run: sh packages/uc-pxx-leds/tests/test-package.sh
      - name: packages/uc-pxx-leds/tests/test-daemon.sh - the LED daemon with fake LEDs, a stub boot-control tool and a socket
        run: sh packages/uc-pxx-leds/tests/test-daemon.sh
      - name: packages/uc-pxx-leds/tests/test-cli.sh - the command uc-pxx-led against the daemon
        run: sh packages/uc-pxx-leds/tests/test-cli.sh
      - name: kernel/tests/test-build-kernel.sh - the pin, the initramfs input, the fragment and the device trees of ci/build-kernel.sh
        run: sh kernel/tests/test-build-kernel.sh
      - name: rootfs/tests/test-kernel-pins.sh - the rootfs kernel package matches kernel/KERNEL_REV.lts
        run: rootfs/tests/test-kernel-pins.sh

  # The ESPHome plugin runs against tsx_panel of tsx-linux-common (the tag in
  # COMMON_REF). TSX_COMMON names the checkout.
  plugin-tests:
    name: ESPHome plugin with tsx-linux-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read COMMON_REF
        id: common
        run: echo "ref=$(grep -v -e '^#' -e '^$' COMMON_REF)" >> "$GITHUB_OUTPUT"
      - name: check out tsx-linux-common ${{ steps.common.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: tsx-mainline/tsx-linux-common
          ref: ${{ steps.common.outputs.ref }}
          path: tsx-linux-common
      - name: rootfs/tests/test-esphome-plugin.sh - the board plugin with a fake input device
        run: sh rootfs/tests/test-esphome-plugin.sh
        env:
          TSX_COMMON: ${{ github.workspace }}/tsx-linux-common
      - name: packages/uc-pxx-leds/tests/test-plugin.sh - the LED plugin with a stand-in daemon and fake LEDs
        run: sh packages/uc-pxx-leds/tests/test-plugin.sh
        env:
          TSX_COMMON: ${{ github.workspace }}/tsx-linux-common
      - name: rootfs/tests/test-autoupdate-hooks.sh - the board hooks with tsx-autoupdate (SKIPPED with a tsx-autoupdate that has no post-update hook)
        run: sh rootfs/tests/test-autoupdate-hooks.sh
        env:
          TSX_COMMON: ${{ github.workspace }}/tsx-linux-common

  # TODO: add a job that runs the shared software of tsx-linux-common with the
  # board files of this repository, as tsx-xx60-linux does (docs/rootfs.md
  # "Board values").
