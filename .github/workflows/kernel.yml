name: kernel
on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the kernel at the revision of kernel/KERNEL_REV.lts, with defconfig and
# arch/arm64/configs/uc-pxx.config. The source is the kernel fork at
# KERNEL_REPO (ci/build-kernel.sh), so the pinned commit must exist there. The
# job fails while the pin is the placeholder. The output goes to out-<flavor>
# in the workspace, because actions/upload-artifact refuses a path with "..".
# The job also runs the tests of the boot image tools.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lts]
    steps:
      - uses: actions/checkout@v4

      - name: install the cross compiler and the kernel build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu make gcc bc bison flex libssl-dev libelf-dev kmod zstd git device-tree-compiler

      - name: install mkbootimg (ci/install-mkbootimg.sh)
        run: ci/install-mkbootimg.sh "$RUNNER_TEMP/mkbootimg"

      - name: kernel/tests/test-mkresource.sh and kernel/tests/test-mkimage.sh
        run: |
          kernel/tests/test-mkresource.sh
          kernel/tests/test-mkimage.sh

      - name: cache the kernel source (${{ matrix.flavor }})
        uses: actions/cache@v4
        with:
          path: ../linux-uc-pxx-${{ matrix.flavor }}
          key: linux-uc-pxx-${{ matrix.flavor }}-${{ hashFiles(format('kernel/KERNEL_REV.{0}', matrix.flavor)) }}

      - name: build (ci/build-kernel.sh --flavor ${{ matrix.flavor }})
        run: ci/build-kernel.sh --flavor ${{ matrix.flavor }} --out out-${{ matrix.flavor }}

      - name: kernel release, commit and sha256
        id: info
        run: |
          echo "release=$(cat out-${{ matrix.flavor }}/kernel.release)" >> "$GITHUB_OUTPUT"
          cat out-${{ matrix.flavor }}/kernel.release
          cat out-${{ matrix.flavor }}/kernel.commit
          cat out-${{ matrix.flavor }}/sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.flavor }}-${{ steps.info.outputs.release }}
          path: |
            out-${{ matrix.flavor }}/Image
            out-${{ matrix.flavor }}/rk3399-crestron-ucp10.dtb
            out-${{ matrix.flavor }}/modules-*.tar.gz
            out-${{ matrix.flavor }}/kernel.release
            out-${{ matrix.flavor }}/kernel.commit
            out-${{ matrix.flavor }}/sha256sums.txt
          if-no-files-found: error
