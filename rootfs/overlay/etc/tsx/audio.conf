# /etc/tsx/audio.conf: sound card setup (uc-pxx-audio init at boot)
# After editing: rc-service uc-pxx-audio restart
#
# Levels in the units of the codec control "PCM Playback Volume" of the
# AIC3104: 0 to 127, one step = 0.5 dB, 127 = 0 dB. The stock firmware plays
# at 115, which is much too loud on the speaker.
# The card name is TSX_SOUND_CARD in the board file. uc-pxx-audio card prints it.
SPEAKER_VOLUME=75
# Control value at 100 % volume. TODO: measure on the speaker. The value must
# stay below the stock level 115.
VOLUME_MAX=100
# Control value at 1 % volume. 0 % is the control value 0.
VOLUME_MIN=40
# Speaker level in % while the Sendspin player runs (uc-pxx-audio fixed). The
# player volume of Music Assistant is then the volume of the panel.
VOLUME_SENDSPIN=100
# Capture level of the PGA (control "PGA Capture Volume"), 0 to 119.
MIC_VOLUME=30
