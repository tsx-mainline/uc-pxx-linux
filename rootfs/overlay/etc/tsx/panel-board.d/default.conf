# /etc/tsx/panel-board.d/default.conf: the values of the uc-pxx board (shell
# syntax). tsx-hw detect builds /run/tsx/panel-board.conf at boot from this
# file, then <model>.conf (UC-P10.conf or UC-P8.conf, the model of the device
# tree) and then local.conf. A key in a later file replaces the key of an
# earlier file. /etc/tsx/panel-board.conf is a link to the result. The kiosk,
# tsx-idled and uc-pxx-als read it after /etc/kiosk.conf. A value in panel.conf
# still wins.
# After editing: tsx-hw detect, rc-service tsx-idled reload,
# rc-service uc-pxx-als reload

# The backlight is a pwm-backlight with the five levels 0, 128, 192, 224 and
# 255 of the PWM duty. So the device has the steps 0 to 4 (max_brightness 4).
# Step 1 is the dimmest lit level and step 4 is the full level (the default
# of the device tree). These values come from the device tree. Nobody has
# tuned them on the glass yet.
BACKLIGHT_MAX=4
BACKLIGHT_MIN=1
BRIGHTNESS_DAY=4
BRIGHTNESS_NIGHT=1

# Light sensor (JSA1213, driver jsa1212): lux = sensor lux x ALS_SCALE. The
# sensor reports 0.5 lux for each count (in_illuminance_scale). ALS_SCALE
# corrects for the front window. 1 means that no correction is known. A value
# in panel.conf wins.
ALS_SCALE=1
# Lux for the full level of the automatic brightness.
AUTO_BRIGHTNESS_LUX=500

# uc-pxx-als writes als-level only when the level changes. tsx-idled applies
# a change at once.
ALS_WATCH=1
