# /etc/tsx/panel-board.d/default.conf: the values of the uc-pxx board (shell
# syntax). tsx-hw detect builds /run/tsx/panel-board.conf at boot from this
# file, then <model>.conf (UC-P10.conf or UC-P8.conf, the model of the device
# tree) and then local.conf. A key in a later file replaces the key of an
# earlier file. /etc/tsx/panel-board.conf is a link to the result. The kiosk,
# tsx-idled and uc-pxx-als read it after /etc/kiosk.conf. A value in panel.conf
# still wins.
# After editing: tsx-hw detect, rc-service tsx-idled reload,
# rc-service uc-pxx-als reload

# The backlight is a pwm-backlight with the 256 levels of the stock curve of
# the UC-P10 (max_brightness 255). Level N gives the duty cycle table[N] of
# 255: the table runs 0, 5, 5, 5, 5, 5, 6, 7 ... 225 and is about 0.875 x N
# above level 8. So level 1 to 5 all give duty 5, level 16 gives duty 14
# (about 5 percent), level 128 gives 112 and level 255 gives 225 (88 percent).
# The stock default level is 240 (duty 210). The UC-P8 has the stock curve
# 0, 4 ... 168 on the same 0 to 255 scale, so these levels also work there.
# The levels are indexes, not duty cycles. The values are not tuned on the
# glass yet.
BACKLIGHT_MAX=255
# The lowest lit level (duty 14, about 5 percent). Slider, keys and auto stop
# here, so the screen never looks off. Levels below 6 would all give duty 5.
BACKLIGHT_MIN=16
# The level at 500 lux and more: the stock default level.
BRIGHTNESS_DAY=240
# The level in a dark room (duty 35, about 14 percent).
BRIGHTNESS_NIGHT=40

# Light sensor (JSA1213, driver jsa1212): lux = sensor lux x ALS_SCALE. The
# sensor reports 0.5 lux for each count (in_illuminance_scale). ALS_SCALE
# corrects for the front window. 1 means that no correction is known. A value
# in panel.conf wins.
ALS_SCALE=1
# The automatic brightness is on by default (user decision 2026-10-24). The
# board file does not set AUTO_BRIGHTNESS: uc-pxx-als treats an unset key as
# on, and the user setting (the Home Assistant switch, panel.conf) turns it off.
# Lux for the full level of the automatic brightness.
AUTO_BRIGHTNESS_LUX=500

# The kiosk scale (Chromium --force-device-scale-factor). The panel is
# 1200x1920 on a 10-inch screen, and at 1 the text is too small (user
# decision 2026-10-24, checked on the unit).
KIOSK_SCALE=1.5

# uc-pxx-als writes als-level only when the level changes. tsx-idled applies
# a change at once.
ALS_WATCH=1
