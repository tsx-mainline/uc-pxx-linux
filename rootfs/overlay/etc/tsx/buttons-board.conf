# /etc/tsx/buttons-board.conf: the touch keys of the UC-P10 (board layer of
# tsx-buttons). tsx-buttons reads this file before /etc/tsx/buttons.conf. A line
# in buttons.conf replaces the same setting or the same key of this file.
#
# The Atmel touch controller reports six touch keys (object T15) as an input
# device. The key codes are the numbers below. This is the physical order,
# from left to right:
#
#   1 Teams   2 Headset   3 Speaker   4 Volume down   5 Volume up   6 Mic
#
# STATUS: verified with evtest on the UC-P10 (2026-10-24). A press of each key
# from left to right gives 148, 149, 202, 114, 115 and 113. The device tree
# lists the keys in the T15 key index order: 113 MUTE, 115 VOLUMEUP,
# 114 VOLUMEDOWN, 202 PROG3, 149 PROG2, 148 PROG1.
#
# The keys have no local action. A press fires the Home Assistant event and
# does nothing else. To bind an action to a key, add an `on` line to
# /etc/tsx/buttons.conf. The name is part of the Home Assistant entity of the
# key.

# No slide along the keys. The keys are not one strip: the volume keys sit
# between Speaker and Mic.
SLIDE_STEP=0

# 1 Teams: KEY_PROG1
button teams 148
# 2 Headset: KEY_PROG2
button headset 149
# 3 Speaker: KEY_PROG3
button speaker 202
# 4 Volume down: KEY_VOLUMEDOWN
button volume_down 114
# 5 Volume up: KEY_VOLUMEUP
button volume_up 115
# 6 Mic (mute): KEY_MUTE
button mic 113

# No LEDs. The four LEDs next to the keys and the RGB status LED are status
# indicators, not key backlights. The package uc-pxx-leds owns all seven (daemon
# uc-pxx-leds, docs/leds.md). tsx-buttons does not touch them: there is no
# LED_MODE, no LED_KEY_N and no led=N here, so tsx-buttons reports "leds no".
