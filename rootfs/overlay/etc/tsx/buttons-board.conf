# /etc/tsx/buttons-board.conf: the touch keys of the UC-P10 (board layer of
# tsx-buttons). tsx-buttons reads this file before /etc/tsx/buttons.conf. A line
# in buttons.conf replaces the same setting or the same key of this file.
#
# The Atmel touch controller reports six touch keys (object T15) as an input
# device. The key codes are the numbers below. This is the physical order,
# from left to right:
#
#   1 Teams   2 Headset   3 Speaker   4 Volume down   5 Volume up   6 Mic
#
# STATUS: verified with evtest on the UC-P10 (2026-10-24). A press of each key
# from left to right gives 148, 149, 202, 114, 115 and 113. The device tree
# lists the keys in the T15 key index order: 113 MUTE, 115 VOLUMEUP,
# 114 VOLUMEDOWN, 202 PROG3, 149 PROG2, 148 PROG1.
#
# The keys have no local action. A press fires the Home Assistant event and
# does nothing else. To bind an action to a key, add an `on` line to
# /etc/tsx/buttons.conf. The name is part of the Home Assistant entity of the
# key.

# No slide along the keys. The keys with an LED are not next to each other:
# the volume keys sit between Speaker and Mic.
SLIDE_STEP=0

# The key LEDs. Each key LED is its own on/off LED class device in
# /sys/class/leds (a GPIO LED). tsx-buttons has no PWM LED here, so the LEDs
# work in the mode `onoff`: a LED is on while the level of the key LEDs is
# above 0. LED_KEY_N names the LED of key LED N. A key picks its LED with led=N.
LED_MODE=onoff
LED_KEY_1=teams_white
LED_KEY_2=mute_headset
LED_KEY_3=mute_speaker
LED_KEY_4=mute_red

# 1 Teams: KEY_PROG1, LED teams_white
button teams 148 led=1
# 2 Headset: KEY_PROG2, LED mute_headset
button headset 149 led=2
# 3 Speaker: KEY_PROG3, LED mute_speaker
button speaker 202 led=3
# 4 Volume down: KEY_VOLUMEDOWN, no LED
button volume_down 114
# 5 Volume up: KEY_VOLUMEUP, no LED
button volume_up 115
# 6 Mic (mute): KEY_MUTE, LED mute_red
button mic 113 led=4

# The RGB status LED (green, red, blue, centre at the bottom) is not a key
# LED. The service uc-pxx-status-led drives it.
