# /etc/tsx/buttons-board.conf: the touch keys of the UC-P10 (board layer of
# tsx-buttons). tsx-buttons reads this file before /etc/tsx/buttons.conf. A line
# in buttons.conf replaces the same setting or the same key of this file.
#
# The Atmel touch controller reports six touch keys (object T15) as an input
# device. The key codes are the numbers below. The names in the comments are
# the Linux key names, in the order of the T15 key map.
#
# The keys have no local action. A press fires the Home Assistant event and
# does nothing else. To bind an action to a key, add an `on` line to
# /etc/tsx/buttons.conf.
#
# TODO: check on a unit which printed key belongs to which code. Then rename
# the keys. The name is part of the Home Assistant entity of the key.

# No slide along the keys.
SLIDE_STEP=0

# KEY_MUTE
button mute 113
# KEY_VOLUMEUP
button volume_up 115
# KEY_VOLUMEDOWN
button volume_down 114
# KEY_PROG3
button prog3 202
# KEY_PROG2
button prog2 149
# KEY_PROG1
button prog1 148

# LEDs. The board has these LED class devices in /sys/class/leds:
#   teams_white, mute_red, mute_speaker, mute_headset   the key LEDs
#   green, red, blue                                     the RGB status LED
# They are plain on/off GPIO LEDs. The key LED lines of tsx-buttons need one
# PWM LED (LED_PWM) and enable LEDs named PREFIX1, PREFIX2 and so on
# (LED_KEY_PREFIX). The LEDs of this board do not fit that scheme. So the keys
# have no `led=N` and no LED_PWM here, and tsx-buttons reports "leds no".
# TODO: add support for named on/off LEDs to tsx-linux-common, or give the
# LEDs a PWM-like wrapper. Then list the four key LEDs here.
