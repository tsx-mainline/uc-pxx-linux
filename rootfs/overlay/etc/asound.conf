# UC-P10 audio devices (measured 2026-10-24 and 2026-11-17).
# Playback: I2S0 runs 4 channels. Channels 1 and 2 are SDO0 (TAS5825M, not
# fitted). Channels 3 and 4 are SDO1 (AIC3104). Channel 3 (left DAC) is not
# wired to anything audible. Channel 4 (right DAC) reaches the hands-free
# speaker through RLOUT and the hf-ext-amp (2026-11-17: tone at the
# speakerphone mics only with RLOUT and the hf amp on; not with HPROUT or
# HPRCOM). The handset amp (hs-ext-amp) is held off: no handset is attached.
# Capture: 8 channels. Channels 1 and 2 are the speakerphone microphones.
# Channel 3 is the handset microphone (AIC3104 LINE1L, powered with
# hs-ext-amp, so silent while the handset amp is off). Channel 4 is the right
# ADC of the AIC3104 (not used). Channels 5 to 7 are silent. Channel 8 is a
# digital copy of playback channel 4 (the echo reference of the stock AEC);
# it is silent only while nothing plays.
# The first 0.5 s of a capture holds the power-up transient of the ADC and the
# PGA. Discard it.
#
# One playback stream is always open (the service uc-pxx-audio-hold plays
# silence into tsx_dmix). The stock firmware did the same (gs_avs kept its
# PCM open and wrote silence frames). The AIC3104 line outputs have no pop
# reduction: powered down they are high impedance, and the codec clocks stop
# with the last stream. Both steps go through the always-on hf amp as a pop.
# With the stream always open, nothing powers down and the clocks run.
# Every client must use the PCMs below, never hw:UCP10,0 directly: the hw
# device is held by the dmix, so a direct open fails with "busy".
#
# PCMs for applications (the tsx board contract, docs/sendspin.md of
# tsx-linux-common):
#   default / speaker / ucp10play -> "Master" softvol -> mono mix -> dmix
#   media                         -> "Media" softvol -> Master    (sendspin; voice ducks it)
#   mic / speakerphone_mics       -> dsnoop, the two speakerphone mics
#   handset_mic, all_mics         -> dsnoop (kept for tests and tools)
# Master and Media stay at 100 % (0 dB). The speaker level is the codec
# control "PCM Playback Volume" (uc-pxx-audio volume), as before.

pcm.tsx_dmix {
	type dmix
	ipc_key 51010
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:UCP10,0"
		rate 48000
		format S32_LE
		channels 4
		period_size 480
		buffer_size 3840
	}
	bindings { 0 0 1 1 2 2 3 3 }
}

# Stereo mixed down to mono (0.5 L + 0.5 R) on all four channels. Channel 4
# is the one that is heard.
pcm.tsx_mono4 {
	type route
	slave { pcm "tsx_dmix"; channels 4 }
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
	ttable.0.2 0.5
	ttable.1.2 0.5
	ttable.0.3 0.5
	ttable.1.3 0.5
}

pcm.tsx_master {
	type softvol
	slave.pcm "tsx_mono4"
	control { name "Master"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.tsx_media {
	type softvol
	slave.pcm "tsx_master"
	control { name "Media"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

# Silence for uc-pxx-audio-hold: the dmix in its own format, no conversion.
pcm.tsx_hold {
	type plug
	slave.pcm "tsx_dmix"
}

# Capture is shared (dsnoop), so the default capture and handset_mic can run at
# the same time.
pcm.ucp10snoop {
	type dsnoop
	ipc_key 1010110
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:UCP10,0"
		channels 8
		rate 48000
		format S32_LE
		period_size 480
		buffer_size 3840
	}
}

pcm.speaker {
	type plug
	slave.pcm "tsx_master"
	hint { show on; description "UC-P10 speaker (Master volume, shared)" }
}
pcm.media {
	type plug
	slave.pcm "tsx_media"
	hint { show on; description "UC-P10 speaker for music (Media + Master volume)" }
}
# The old name of the default playback device
pcm.ucp10play {
	type plug
	slave.pcm "tsx_master"
}

# The two speakerphone microphones as stereo
pcm.speakerphone_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
}
pcm.mic {
	type plug
	slave.pcm "speakerphone_mics"
	hint { show on; description "UC-P10 speakerphone microphones (shared)" }
}

# Handset microphone, mono
pcm.handset_mic {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.2 1
}

# All live microphones: channel 1 = speakerphone left, channel 2 =
# speakerphone right, channel 3 = handset
pcm.all_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
	ttable.2.2 1
}

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mic"
}
ctl.!default { type hw; card UCP10; }

# Opening these PCMs creates the "Master" and "Media" controls on the card
# without touching the hardware (uc-pxx-audio init opens them). The parameters
# must stay identical to tsx_master and tsx_media above.
pcm.tsx_master_ctl {
	type softvol
	slave.pcm "null"
	control { name "Master"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
pcm.tsx_media_ctl {
	type softvol
	slave.pcm "null"
	control { name "Media"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
