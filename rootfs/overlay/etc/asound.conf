# UC-P10 audio devices (measured 2026-10-24).
# Playback: I2S0 runs 4 channels. Channels 1 and 2 are SDO0 (TAS5825M, not
# fitted on the unit that we used). Channels 3 and 4 are SDO1 (AIC3104).
# Channel 3 (left DAC) is not wired to anything audible. Channel 4 (right
# DAC) drives the hands-free speaker and the handset earpiece. The enables
# hf-ext-amp and hs-ext-amp select them. Both are on by default.
# Capture: 8 channels. Channels 1 and 2 are the speakerphone microphones.
# Channel 3 is the handset microphone (AIC3104 LINE1L, powered with
# hs-ext-amp). Channel 4 is the right ADC of the AIC3104 (not used). Channels
# 5 to 8 are silent.
# The first 0.5 s of a capture holds the power-up transient of the ADC and the
# PGA. Discard it.

# Capture is shared (dsnoop). So the default capture and handset_mic can run at
# the same time.
pcm.ucp10snoop {
	type dsnoop
	ipc_key 1010110
	ipc_perm 0666
	slave {
		pcm "hw:UCP10,0"
		channels 8
		rate 48000
		format S32_LE
		period_size 480
		buffer_size 3840
	}
}

# Default playback: stereo mixed down to mono (0.5 L + 0.5 R) on all four
# channels. Channel 4 is the one that is heard.
pcm.ucp10play {
	type plug
	slave { pcm "hw:UCP10,0"; channels 4; }
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
	ttable.0.2 0.5
	ttable.1.2 0.5
	ttable.0.3 0.5
	ttable.1.3 0.5
}

# Default capture: the two speakerphone microphones as stereo
pcm.speakerphone_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
}

# Handset microphone, mono
pcm.handset_mic {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.2 1
}

# All live microphones: channel 1 = speakerphone left, channel 2 =
# speakerphone right, channel 3 = handset
pcm.all_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
	ttable.2.2 1
}

pcm.!default {
	type asym
	playback.pcm "ucp10play"
	capture.pcm "speakerphone_mics"
}
ctl.!default { type hw; card UCP10; }
