# Write dirty pages to the eMMC sooner (the kernel default is 3000 and 500).
# A PoE panel loses its power without a shutdown. With the defaults, data
# can stay in RAM for up to 35 s and is lost at a power cut. A new Home
# Assistant login in the Local Storage of Chromium was lost this way.
# Now a page that is dirty for 5 s is written, and the flusher wakes every
# 1 s. This costs a few more small writes.
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
